help.title=Hilfe
help.music.title=🎵 Musik
help.music.body=`/play query:...` — Song oder Playlist abspielen\n`/queue` · `/skip` — Queue / nächster Song\n`/pause` · `/resume` — Wiedergabe steuern\n`/volume percent:0–100` — Lautstärke\n`/stop` · `/leave` — Queue leeren / Kanal verlassen\n*Zur Steuerung dem Sprachkanal des Bots beitreten.*\n`/lyrics [query:...]` — Songtext zum aktuellen Song oder einer Suche\n`/repeat [mode:on|off]` · `T.repeat on` / `T.repeat off`
help.moderation.title=🛡️ Moderation
help.moderation.body=`/kick` · `/ban` · `/unban` — Nutzer entfernen oder bannen\n`/timeout` · `/untimeout` — Timeouts verwalten\n`/purge count:1–100` — Junge Nachrichten löschen\n`/snipe` — Letzte gespeicherte gelöschte Nachricht\n`/slowmode seconds:0–21600` — Kanalverzögerung setzen\n*Mod-Rechte nötig. Optional `reason`, falls verfügbar.*
help.general.title=💬 Allgemein
help.general.body=`/avatar user_id:...` — Profilbild per ID\n`/ping` — Verbindungslatenz\n`/stats` — Laufzeit, Server, Mitglieder und Version\n`/language` — Sprache anzeigen; mit `code` ändern\n`/help` — Befehlsübersicht\n`/prefix [value:...]` — Prefix anzeigen/ändern; auch normale Commands wie T.play möglich
help.owner.title=👑 Nur Bot-Inhaber
help.owner.body=`/shutdown` — Bot herunterfahren\n`/uptime` — Sitzungslaufzeit anzeigen\n`/restart` — Bot wird neu gestartet\n`/status` — Aktuelle Statuseinstellungen\n`/status action:start texts:...` — Status setzen\n`/status action:stop` — Standardstatus wiederherstellen
