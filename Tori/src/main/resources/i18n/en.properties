help.title=Help
help.music.title=🎵 Music
help.music.body=`/play query:...` — Play a song or playlist\n`/queue` · `/skip` — Queue / next song\n`/pause` · `/resume` — Playback controls\n`/volume percent:0–100` — Volume\n`/stop` · `/leave` — Clear queue / disconnect\n*Join the bot’s voice channel to control music.*\n`/lyrics [query:...]` — Lyrics for the current song or a search\n`/repeat [mode:on|off]` · `T.repeat on` / `T.repeat off`
help.moderation.title=🛡️ Moderation
help.moderation.body=`/kick` · `/ban` · `/unban` — Remove or ban users\n`/timeout` · `/untimeout` — Manage timeouts\n`/purge count:1–100` — Delete recent messages\n`/snipe` — Last cached deleted message\n`/slowmode seconds:0–21600` — Set channel delay\n*Moderator permissions required. Add `reason` where available.*
help.general.title=💬 General
help.general.body=`/avatar user_id:...` — Profile picture by ID\n`/ping` — Connection latency\n`/stats` — Uptime, servers, members and version\n`/language` — View language; add `code` to change it\n`/help` — Command guide\n`/prefix [value:...]` — Show/change prefix; normal commands such as T.play also work
help.owner.title=👑 Owner only
help.owner.body=`/shutdown` — Shut down the bot\n`/uptime` — Show session uptime\n`/restart` — Restarting the bot\n`/status` — View current status settings\n`/status action:start texts:...` — Set a status\n`/status action:stop` — Restore default status
