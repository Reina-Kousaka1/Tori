help.title=Hulp
help.music.title=🎵 Muziek
help.music.body=`/play query:...` — Nummer of afspeellijst afspelen\n`/queue` · `/skip` — Wachtrij / volgend nummer\n`/pause` · `/resume` — Afspelen bedienen\n`/volume percent:0–100` — Volume\n`/stop` · `/leave` — Wachtrij wissen / kanaal verlaten\n*Ga naar het spraakkanaal van de bot om muziek te bedienen.*\n`/lyrics [query:...]` — Songtekst voor het huidige nummer of een zoekterm\n`/repeat [mode:on|off]` · `T.repeat on` / `T.repeat off`
help.moderation.title=🛡️ Moderatie
help.moderation.body=`/kick` · `/ban` · `/unban` — Gebruikers verwijderen of verbannen\n`/timeout` · `/untimeout` — Time-outs beheren\n`/purge count:1–100` — Recente berichten verwijderen\n`/snipe` — Laatste opgeslagen verwijderde bericht\n`/slowmode seconds:0–21600` — Kanaalvertraging instellen\n*Moderatierechten vereist. Voeg waar mogelijk `reason` toe.*
help.general.title=💬 Algemeen
help.general.body=`/avatar user_id:...` — Profielfoto via ID\n`/ping` — Verbindingslatentie\n`/stats` — Looptijd, servers, leden en versie\n`/language` — Taal bekijken; voeg `code` toe om te wijzigen\n`/help` — Commando-overzicht\n`/prefix [value:...]` — Prefix tonen/wijzigen; gewone commands zoals T.play werken ook
help.owner.title=👑 Alleen boteigenaar
help.owner.body=`/shutdown` — Bot afsluiten\n`/uptime` — Sessielooptijd tonen\n`/restart` — De bot wordt herstart\n`/status` — Huidige statusinstellingen\n`/status action:start texts:...` — Status instellen\n`/status action:stop` — Standaardstatus herstellen
