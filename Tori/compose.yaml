name: tori-main

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: tori
      POSTGRES_PASSWORD: ${TORI_POSTGRES_PASSWORD:?PostgreSQL-Passwort in .env setzen}
      POSTGRES_DB: tori_main
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:2334:2333"
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Passwort in .env setzen}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      _JAVA_OPTIONS: "-Xmx512m -Xms256m"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
  economy-api:
    build:
      context: ./economy-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TORI_ECONOMY_API_ENABLED: "true"
      TORI_ECONOMY_API_SECRET: ${TORI_ECONOMY_API_SECRET:?Economy-API-Secret in .env setzen}
      TORI_ECONOMY_BIND: 0.0.0.0
      TORI_ECONOMY_PORT: "4001"
      TORI_ECONOMY_DATABASE_HOST: postgres
      TORI_ECONOMY_DATABASE_PORT: "5432"
      TORI_ECONOMY_DATABASE_NAME: tori_main
      TORI_ECONOMY_DATABASE_USER: tori
      TORI_ECONOMY_DATABASE_PASSWORD: ${TORI_POSTGRES_PASSWORD:?PostgreSQL-Passwort in .env setzen}
      TORI_ECONOMY_DATABASE_URL: ${TORI_ECONOMY_DATABASE_URL:-}
      TORI_ECONOMY_WRITE_ENABLED: ${TORI_ECONOMY_WRITE_ENABLED:-false}
      TORI_ECONOMY_WRITE_MODE: ${TORI_ECONOMY_WRITE_MODE:-disabled}
      TORI_ECONOMY_PRODUCTION_DATABASE_NAME: ${TORI_ECONOMY_PRODUCTION_DATABASE_NAME:-}
      TORI_ECONOMY_PRODUCTION_CUTOVER_ACK: ${TORI_ECONOMY_PRODUCTION_CUTOVER_ACK:-}
      TORI_ECONOMY_PRODUCTION_WRITE_OPERATIONS: ${TORI_ECONOMY_PRODUCTION_WRITE_OPERATIONS:-}
      TORI_SHOP_ROTATION_HOURS: ${TORI_SHOP_ROTATION_HOURS:-24}
      TORI_SHOP_ROTATION_SIZE: ${TORI_SHOP_ROTATION_SIZE:-12}
      TORI_NOSTRUM_ENABLED: ${TORI_NOSTRUM_ENABLED:-false}
      TORI_NOSTRUM_SHOP_ENABLED: ${TORI_NOSTRUM_SHOP_ENABLED:-false}
      TORI_AUTOMOD_ENABLED: ${TORI_AUTOMOD_ENABLED:-false}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:4001/internal/economy/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  bot:
    build: .
    restart: always
    stop_grace_period: 75s
    depends_on:
      lavalink:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BOT_RESTART_EXTERNAL: "true"
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      MODLOG_WEBHOOK_URL: ${MODLOG_WEBHOOK_URL:-}
      BOT_DEFAULT_LANGUAGE: ${BOT_DEFAULT_LANGUAGE:-de}
      TORI_DATABASE_URL: jdbc:postgresql://postgres:5432/tori_main
      TORI_DATABASE_USER: tori
      TORI_DATABASE_PASSWORD: ${TORI_POSTGRES_PASSWORD:?PostgreSQL-Passwort in .env setzen}
      LAVALINK_URI: ws://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Passwort in .env setzen}
      TORI_NOSTRUM_ENABLED: ${TORI_NOSTRUM_ENABLED:-false}
      TORI_NOSTRUM_SHOP_ENABLED: ${TORI_NOSTRUM_SHOP_ENABLED:-false}
      TORI_ECONOMY_URL: http://economy-api:4001
      TORI_ECONOMY_API_SECRET: ${TORI_ECONOMY_API_SECRET:?Economy-API-Secret in .env setzen}
      TORI_ECONOMY_ROUTING: "${TORI_ECONOMY_ROUTING:-balance=LEGACY,inventory=LEGACY,shop=LEGACY,leaderboard=LEGACY,daily=LEGACY,transfer=LEGACY}"
volumes:
  postgres-data:
