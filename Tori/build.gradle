plugins {
    id 'java'
    id 'application'
}
def botMetadata = new Properties()
file('src/main/resources/bot-version.properties').withInputStream { botMetadata.load(it) }
version = botMetadata.getProperty('version')
repositories {
    mavenCentral()
    maven { url = uri('https://maven.lavalink.dev/releases') }
}
dependencies {
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'net.dv8tion:JDA:6.5.0'
    implementation 'dev.arbjerg:lavalink-client:3.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.4.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'music.Main' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }

tasks.register('registerCommands', JavaExec) {
    group = 'application'
    description = 'Publish the slash commands to Discord without starting the bot or Lavalink.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args '--register-commands'
}
